# Owner-triggered deployment of the Atlas Service Desk demo from trusted main:
#   build-image (no Azure; pushes the scenario's image to GHCR, outputs its digest)
#   -> plan (azure-plan, Reader; lifetime + expiry, fail-closed policy)
#   -> your approval (azure-deploy) -> apply exactly that plan (after the pre-apply
#   lifetime gate), validate, API + browser tests with temporary /32 runner access,
#   remove it, optional inspection window (after the pre-window gate), destroy.
# failure-cleanup (azure-destroy) runs if apply failed, was cancelled or was not
# approved: it destroys only what this run attempted to apply; a run that stopped
# before apply never destroys a pre-existing unexpired environment.
# report prints application and cleanup results separately (no URL, no IP).
# Raw plans, state and variable values are never printed or uploaded as artifacts.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "healthy, or deliberate-failure-ignore-status (fault build; the run fails by design)"
        type: choice
        options: [healthy, deliberate-failure-ignore-status]
        default: healthy
      inspection_minutes:
        description: "Owner inspection window in minutes (healthy scenario only)"
        type: choice
        options: ["0", "15", "30", "45"]
        default: "30"

# Explicit bash = "bash --noprofile --norc -eo pipefail": a failing command is not
# hidden by a succeeding "| sanitize.sh" or "| tee" later in the pipeline.
defaults:
  run:
    shell: bash

permissions: {}

# Shared with destroy.yml: deployment and destruction never overlap.
concurrency:
  group: atlas-azure-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_create_resource_group: "false"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}

jobs:
  build-image:
    name: Build and push the app image (no Azure access)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.push.outputs.app_image }}
      app_variant: ${{ steps.push.outputs.app_variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the scenario's image and push it by digest
        id: push
        env:
          SCENARIO: ${{ inputs.scenario }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/build-push.sh "${SCENARIO}"

  plan:
    name: Plan (sanitised summary)
    needs: build-image
    if: github.ref == 'refs/heads/main' && needs.build-image.result == 'success'
    runs-on: ubuntu-24.04
    environment: azure-plan
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_admin_source_ip_cidr: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_owner: ${{ secrets.OWNER_TAG }}
      TF_VAR_app_image: ${{ needs.build-image.outputs.app_image }}
      TF_VAR_app_variant: ${{ needs.build-image.outputs.app_variant }}
      EXPECTED_APP_IMAGE: ${{ needs.build-image.outputs.app_image }}
      # Derived from the scenario independently of the build output; plan policy compares.
      EXPECTED_APP_VARIANT: ${{ inputs.scenario == 'deliberate-failure-ignore-status' && 'broken-ignore-status' || 'healthy' }}
      SCENARIO: ${{ inputs.scenario }}
      INSPECTION_MINUTES: ${{ inputs.inspection_minutes }}
    outputs:
      plan_sha256: ${{ steps.summary.outputs.plan_sha256 }}
      has_changes: ${{ steps.summary.outputs.has_changes }}
      plan_blob: ${{ steps.store.outputs.plan_blob }}
      expires_at: ${{ steps.lifetime.outputs.expires_at }}
      inspection_minutes: ${{ steps.lifetime.outputs.inspection_minutes }}
      app_image: ${{ needs.build-image.outputs.app_image }}
      app_variant: ${{ needs.build-image.outputs.app_variant }}
    steps:
      - name: Mask Azure identifiers for the rest of this job
        # Tenant, subscription and client IDs and the storage account are variables, not
        # secrets, so GitHub would print them in every later step's env block.
        run: |
          for v in "${ARM_TENANT_ID}" "${ARM_SUBSCRIPTION_ID}" "${ARM_CLIENT_ID}" "${TFSTATE_STORAGE_ACCOUNT}"; do
            if [[ -n "${v}" ]]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Azure login (OIDC, plan identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Lifetime - plan expiry (02:00 UK auto-shutdown, 03:30 UTC Destroy, 3 h cap)
        id: lifetime
        run: python3 scripts/ci/lifetime.py plan --scenario "${SCENARIO}" --inspection-minutes "${INSPECTION_MINUTES}"
      - name: Terraform init (remote state, Entra ID)
        run: ./scripts/ci/backend-init.sh 2>&1 | ./scripts/ci/sanitize.sh
      - name: Terraform plan (full output kept off the log)
        env:
          TF_VAR_expires_at: ${{ steps.lifetime.outputs.expires_at }}
        run: |
          if ! terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan >"${RUNNER_TEMP}/plan.log" 2>&1; then
            echo "terraform plan failed; sanitised tail:"
            tail -n 40 "${RUNNER_TEMP}/plan.log" | ./scripts/ci/sanitize.sh
            exit 1
          fi
      - name: Sanitised plan summary
        id: summary
        run: ./scripts/ci/plan-summary.sh tfplan | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Store the reviewed plan privately (state container, plans/, 7-day expiry)
        id: store
        if: steps.summary.outputs.has_changes == 'true'
        run: |
          blob="plans/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan"
          az storage blob upload --auth-mode login --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --container-name "${TFSTATE_CONTAINER}" --name "${blob}" --file tfplan \
            --no-progress --only-show-errors --output none
          echo "plan_blob=${blob}" >>"${GITHUB_OUTPUT}"
      - name: Remove local plan files
        if: always()
        run: rm -f tfplan "${RUNNER_TEMP}/plan.log"

  apply:
    name: Apply reviewed plan and validate
    needs: plan
    # Runs even when the plan has no changes, so an existing workload is still tested
    # and destroyed.
    if: github.ref == 'refs/heads/main' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: azure-deploy
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_admin_source_ip_cidr: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_owner: ${{ secrets.OWNER_TAG }}
      TF_VAR_app_image: ${{ needs.plan.outputs.app_image }}
      TF_VAR_app_variant: ${{ needs.plan.outputs.app_variant }}
      TF_VAR_expires_at: ${{ needs.plan.outputs.expires_at }}
      EXPECTED_ADMIN_CIDR: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
      EXPECTED_APP_IMAGE: ${{ needs.plan.outputs.app_image }}
      EXPECTED_APP_VARIANT: ${{ needs.plan.outputs.app_variant }}
      EXPIRES_AT: ${{ needs.plan.outputs.expires_at }}
      SCENARIO: ${{ inputs.scenario }}
      INSPECTION_MINUTES: ${{ needs.plan.outputs.inspection_minutes }}
      PLAN_BLOB: ${{ needs.plan.outputs.plan_blob }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    outputs:
      stopped_before_apply: ${{ steps.gate.outputs.stopped }}
      apply_attempted: ${{ steps.attempt.outputs.attempted }}
      flow_outcome: ${{ steps.flow.outcome }}
      ui_outcome: ${{ steps.ui.outcome }}
      window: ${{ steps.window_gate.outputs.decision }}
      window_outcome: ${{ steps.window.outcome }}
      destroy_outcome: ${{ steps.destroy.outcome }}
    steps:
      - name: Mask Azure identifiers for the rest of this job
        # Tenant, subscription and client IDs and the storage account are variables, not
        # secrets, so GitHub would print them in every later step's env block.
        run: |
          for v in "${ARM_TENANT_ID}" "${ARM_SUBSCRIPTION_ID}" "${ARM_CLIENT_ID}" "${TFSTATE_STORAGE_ACCOUNT}"; do
            if [[ -n "${v}" ]]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Azure login (OIDC, deploy identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init (remote state, Entra ID)
        run: ./scripts/ci/backend-init.sh 2>&1 | ./scripts/ci/sanitize.sh
      - name: Lifetime gate before apply (full budget incl. margin; stop before creating anything)
        id: gate
        run: |
          if python3 scripts/ci/lifetime.py pre-apply --scenario "${SCENARIO}" \
               --inspection-minutes "${INSPECTION_MINUTES}" --expires-at "${EXPIRES_AT}"; then
            exit 0
          fi
          echo "stopped=true" >>"${GITHUB_OUTPUT}"
          echo "::error::Stopped before apply: insufficient lifetime. Nothing was created by this run."
          exit 1
      - name: Fetch the reviewed plan and verify its SHA-256
        if: needs.plan.outputs.has_changes == 'true'
        run: |
          az storage blob download --auth-mode login --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --container-name "${TFSTATE_CONTAINER}" --name "${PLAN_BLOB}" --file tfplan \
            --no-progress --only-show-errors --output none
          echo "${PLAN_SHA256}  tfplan" | sha256sum -c --strict -
      - name: Record that apply is being attempted
        id: attempt
        if: needs.plan.outputs.has_changes == 'true'
        run: echo "attempted=true" >>"${GITHUB_OUTPUT}"
      - name: Apply exactly the reviewed plan
        if: needs.plan.outputs.has_changes == 'true'
        run: terraform apply -input=false -lock-timeout=5m -no-color tfplan 2>&1 | ./scripts/ci/sanitize.sh
      - name: Delete the stored plan
        if: always() && needs.plan.outputs.has_changes == 'true'
        run: |
          rm -f tfplan
          az storage blob delete --auth-mode login --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --container-name "${TFSTATE_CONTAINER}" --name "${PLAN_BLOB}" --only-show-errors --output none \
            || echo "plan blob not deleted now; the 7-day lifecycle rule removes it"
      - name: App address (masked; the URL is delivered privately, never logged)
        run: |
          ip="$(terraform output -raw public_ip_address)"
          [[ "${ip}" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "ERROR: invalid public_ip_address output"; exit 1; }
          echo "::add-mask::${ip}"
          echo "APP_IP=${ip}" >>"${GITHUB_ENV}"
      - name: Runner public IP (masked)
        run: |
          cidr="$(./scripts/ci/runner-ip.sh)"
          echo "::add-mask::${cidr%/32}"
          echo "::add-mask::${cidr}"
          echo "RUNNER_CIDR=${cidr}" >>"${GITHUB_ENV}"
      - name: Temporary /32 access for this runner
        run: ./scripts/ci/temp-access.sh add "${RUNNER_CIDR}"
      - name: Wait for the ticket app
        id: health
        run: ./scripts/ci/wait-for-health.sh
      - name: Public endpoint checks (from the runner)
        run: ./scripts/azure-validate.sh public 2>&1 | ./scripts/ci/sanitize.sh
      - name: In-VM checks (Azure Run Command)
        run: |
          printf '%s\n' "${TF_VAR_admin_ssh_public_key}" >"${RUNNER_TEMP}/admin.pub"
          ADMIN_PUBKEY_FILE="${RUNNER_TEMP}/admin.pub" ./scripts/azure-validate.sh in-vm 2>&1 | ./scripts/ci/sanitize.sh
      - name: Application test - independent API flow (create, update status, read back)
        id: flow
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: python3 tests/app/flow_check.py --base-url "http://${APP_IP}" --label "CI-TEST ${GITHUB_RUN_ID}" 2>&1 | ./scripts/ci/sanitize.sh
      - name: Application test - browser (Playwright, Chromium)
        id: ui
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: |
          docker build -q -t atlas-ui-check tests/app/ui >/dev/null
          docker run --rm --network host -v "${PWD}/tests/app/ui:/ui:ro" atlas-ui-check \
            python3 /ui/ui_check.py --base-url "http://${APP_IP}" --label "CI-TEST ${GITHUB_RUN_ID}" --expect-expiry 2>&1 | ./scripts/ci/sanitize.sh
      - name: Remove temporary runner access (always)
        if: always()
        run: ./scripts/ci/temp-access.sh remove 2>&1 | ./scripts/ci/sanitize.sh
      - name: Confirm runner access is blocked again
        run: ./scripts/azure-validate.sh blocked 2>&1 | ./scripts/ci/sanitize.sh
      - name: Lifetime gate before the inspection window (never shortened)
        id: window_gate
        if: success() && inputs.scenario == 'healthy' && needs.plan.outputs.inspection_minutes != '0'
        run: |
          python3 scripts/ci/lifetime.py pre-window --scenario "${SCENARIO}" \
            --inspection-minutes "${INSPECTION_MINUTES}" --expires-at "${EXPIRES_AT}" || [[ $? == 1 ]]
      - name: Inspection window (URL delivered privately; cancel the run to end early)
        id: window
        if: success() && steps.window_gate.outputs.decision == 'pass'
        run: ./scripts/ci/inspection-window.sh
      - name: Destroy workload
        id: destroy
        if: success()
        run: |
          terraform destroy -auto-approve -input=false -lock-timeout=5m -no-color 2>&1 | ./scripts/ci/sanitize.sh
          KEEP_RESOURCE_GROUP=1 ./scripts/verify-cleanup.sh 2>&1 | ./scripts/ci/sanitize.sh

  failure-cleanup:
    name: Cleanup after failed or cancelled deployment
    needs: [plan, apply]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
      (needs.apply.result == 'failure' || needs.apply.result == 'cancelled')
    runs-on: ubuntu-24.04
    environment: azure-destroy
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_admin_source_ip_cidr: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_owner: ${{ secrets.OWNER_TAG }}
      TF_VAR_app_image: ${{ needs.plan.outputs.app_image }}
      TF_VAR_app_variant: ${{ needs.plan.outputs.app_variant }}
      TF_VAR_expires_at: ${{ needs.plan.outputs.expires_at }}
      APPLY_ATTEMPTED: ${{ needs.apply.outputs.apply_attempted }}
      OWN_EXPIRES_AT: ${{ needs.plan.outputs.expires_at }}
    outputs:
      decision: ${{ steps.cleanup.outputs.decision }}
      result: ${{ steps.cleanup.outputs.result }}
    steps:
      - name: Mask Azure identifiers for the rest of this job
        # Tenant, subscription and client IDs and the storage account are variables, not
        # secrets, so GitHub would print them in every later step's env block.
        run: |
          for v in "${ARM_TENANT_ID}" "${ARM_SUBSCRIPTION_ID}" "${ARM_CLIENT_ID}" "${TFSTATE_STORAGE_ACCOUNT}"; do
            if [[ -n "${v}" ]]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Azure login (OIDC, deploy identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init (remote state, Entra ID)
        run: ./scripts/ci/backend-init.sh 2>&1 | ./scripts/ci/sanitize.sh
      - name: Remove temporary runner access if it is still there
        run: ./scripts/ci/temp-access.sh remove 2>&1 | ./scripts/ci/sanitize.sh
      - name: Guarded destroy (only what this run attempted to apply; protect on uncertainty)
        id: cleanup
        if: always()
        run: MODE=failure-cleanup ./scripts/ci/guarded-destroy.sh 2>&1 | ./scripts/ci/sanitize.sh

  report:
    name: Report (application and cleanup results, no URL)
    needs: [build-image, plan, apply, failure-cleanup]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SCENARIO: ${{ inputs.scenario }}
      INSPECTION_MINUTES: ${{ needs.plan.outputs.inspection_minutes || '0' }}
      APP_IMAGE: ${{ needs.build-image.outputs.app_image }}
      EXPIRES_AT: ${{ needs.plan.outputs.expires_at }}
      PLAN_RESULT: ${{ needs.plan.result }}
      APPLY_RESULT: ${{ needs.apply.result }}
      STOPPED_BEFORE_APPLY: ${{ needs.apply.outputs.stopped_before_apply }}
      APPLY_ATTEMPTED: ${{ needs.apply.outputs.apply_attempted }}
      FLOW_OUTCOME: ${{ needs.apply.outputs.flow_outcome }}
      UI_OUTCOME: ${{ needs.apply.outputs.ui_outcome }}
      WINDOW: ${{ needs.apply.outputs.window }}
      WINDOW_OUTCOME: ${{ needs.apply.outputs.window_outcome }}
      DESTROY_OUTCOME: ${{ needs.apply.outputs.destroy_outcome }}
      CLEANUP_JOB_RESULT: ${{ needs.failure-cleanup.result }}
      CLEANUP_DECISION: ${{ needs.failure-cleanup.outputs.decision }}
      CLEANUP_RESULT: ${{ needs.failure-cleanup.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Application vs cleanup report (fails the run unless the app passed)
        run: python3 scripts/ci/run-report.py | tee -a "${GITHUB_STEP_SUMMARY}"
