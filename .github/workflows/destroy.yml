# Routine workload destruction: VM, disk, NIC, public IP, NSG, VNet, schedule.
# Keeps the persistent bootstrap resources (workload resource group + its role
# assignments, state backend, identities) so the next deployment works.
# Complete teardown of backend and identities is bootstrap/teardown.sh (owner-run).
#
# The nightly schedule is a SAFEGUARD, not a spending cap: GitHub can delay or
# skip scheduled runs and disables them after 60 days without repository activity.
name: Destroy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily, after the 02:00 UK auto-shutdown

# Explicit bash = "bash --noprofile --norc -eo pipefail": a failing command is not
# hidden by a succeeding "| sanitize.sh" or "| tee" later in the pipeline.
defaults:
  run:
    shell: bash

permissions: {}

# Shared with deploy.yml: deployment and destruction never overlap.
concurrency:
  group: atlas-azure-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_create_resource_group: "false"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}

jobs:
  destroy:
    name: Destroy workload (keep bootstrap resources)
    # Skips quietly until the owner has run the bootstrap and GitHub setup.
    if: github.ref == 'refs/heads/main' && vars.TFSTATE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-24.04
    environment: azure-destroy
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_admin_source_ip_cidr: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_owner: ${{ secrets.OWNER_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Azure login (OIDC, deploy identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init (remote state, Entra ID)
        run: ./scripts/ci/backend-init.sh 2>&1 | ./scripts/ci/sanitize.sh
      - name: Remove temporary runner access if it is still there
        run: ./scripts/ci/temp-access.sh remove 2>&1 | ./scripts/ci/sanitize.sh
      - name: Destroy the workload
        if: always()
        run: terraform destroy -auto-approve -input=false -lock-timeout=10m -no-color 2>&1 | ./scripts/ci/sanitize.sh
      - name: Verify cleanup (resource group kept, empty)
        if: always()
        run: KEEP_RESOURCE_GROUP=1 ./scripts/verify-cleanup.sh 2>&1 | ./scripts/ci/sanitize.sh
