# Offline checks for every pull request. No Azure credentials, no id-token
# permission and no secrets: untrusted pull-request code never gets Azure access.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Explicit bash = "bash --noprofile --norc -eo pipefail": a failing command is not
# hidden by a succeeding "| sanitize.sh" or "| tee" later in the pipeline.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (no Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install cloud-init, ShellCheck, PyYAML and actionlint
        run: ./scripts/ci/install-ci-tools.sh

      - name: Run every offline check (a skipped check fails the job)
        env:
          REQUIRE_ALL: "1"
        run: ./scripts/validate.sh
