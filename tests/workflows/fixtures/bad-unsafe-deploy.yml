# Deliberately unsafe deployment workflow. Used only by test_workflow_policy.py.
name: bad-deploy
on:
  pull_request_target:
  workflow_dispatch:
permissions: {}
jobs:
  apply:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: terraform apply -auto-approve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          path: tfplan
